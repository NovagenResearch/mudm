site_name: muDM — micro Data Model
site_description: >-
  The core data model for muDM spatial data: GeoJSON-inspired Pydantic models
  for microscopy annotations, 3D mesh geometry, coordinate transforms, tile
  metadata, ontology vocabularies, and provenance.
site_url: https://novagenresearch.github.io/mudm/
site_author: Bengt Ljungquist

repo_url: https://github.com/NovagenResearch/mudm
repo_name: NovagenResearch/mudm
edit_uri: edit/main/docs/

copyright: Copyright &copy; muDM contributors — MIT License

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            # The core models document their fields as pydantic/prose docstrings
            # that are not strict Google style. Silence griffe's docstring-style
            # warnings so `--strict` only fails on real doc defects (broken links,
            # missing objects, bad nav) — not docstring formatting.
            docstring_options:
              warnings: false
              warn_unknown_params: false
              warn_missing_types: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NovagenResearch/mudm
    - icon: material/toolbox-outline
      link: https://novagenresearch.github.io/mudm-tools/
      name: mudm-tools (processing pipelines)

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Specification: specification.md
  - Guides:
      - guides/index.md
      - Examples: guides/examples.md
      - Metadata & Properties: guides/metadata.md
      - Ontology Vocabularies: guides/vocabularies.md
      - Coordinate Transforms: guides/transforms.md
      - Spatial Layout: guides/layout.md
      - Tile Metadata: guides/tiles.md
      - Validation: guides/validation.md
      - Provenance & Traceability: guides/provenance.md
  - Reference:
      - reference/index.md
      - Data Model API: reference/models.md
  - About:
      - about.md
      - License: license.md
