[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mudm"
version = "0.6.1"
description = "muDM (micro Data Model) — a GeoJSON-inspired data model for microscopy spatial data."
readme = "README.md"
authors = [
    { name = "Bengt Ljungquist", email = "bengt.ljungquist@ngrf.org" },
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["json", "microscopy", "mudm", "spatial-data", "geojson"]
dependencies = [
    "pydantic>=2.3.0",
    "geojson-pydantic>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/NovagenResearch/mudm"
Documentation = "https://novagenresearch.github.io/mudm/"
Source = "https://github.com/NovagenResearch/mudm"
Issues = "https://github.com/NovagenResearch/mudm/issues"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mudm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = ["src/"]
